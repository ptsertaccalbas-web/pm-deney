name: gunluk-veri-cek

on:
  schedule:
    - cron: "0 6 * * *"   # her gün 06:00 UTC = 09:00 Türkiye
  workflow_dispatch:       # Actions sekmesinden elle de çalıştırılabilir
  push:                    # kod değişince de çalışsın (veri commit'leri bot token'ıyla, tetiklemez)
    paths:
      - "fetch_markets.py"
      - "predict.py"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: pm-deney
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Piyasaları çek
        run: python fetch_markets.py

      - name: Evren fiyatları + Gemini tahminleri
        if: always() && env.GEMINI_API_KEY != ''   # anahtar girilmemişse atla
        env:
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_GROUNDING: "1"
        run: python predict.py

      - name: Veriyi commit et
        if: always()   # HATA olsa bile run_log.csv commit edilsin
        run: |
          git config user.name "pm-deney-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "değişiklik yok" || git commit -m "veri: $(date -u +%Y-%m-%d) $(date -u +%H:%M) UTC"
          git push
